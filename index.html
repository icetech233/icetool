    <script>
      // 在首次绘制前同步应用主题，避免深色用户看到白色闪屏（FOUC）。
      (function () {
        try {
          var stored = localStorage.getItem('ice:theme');
          var isDark =
            stored === 'dark' ||
            (stored === null &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', isDark);
        } catch (e) {
          /* localStorage 不可用时保持默认浅色 */
        }
      })();
    </script>
